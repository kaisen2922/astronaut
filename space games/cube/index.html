<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Cube - ASTRA Recreation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui">
        <div class="ui__background"></div>
        <div class="ui__game"></div>
        <div class="ui__texts">
            <h1 class="text text--title">
                <span>THE</span>
                <span>CUBE</span>
            </h1>
            <div class="text text--note">
                Double tap to start
            </div>
            <div class="text text--timer">
                0:00
            </div>
            <div class="text text--complete">
                <span>COMPLETE!</span>
            </div>
            <div class="text text--best-time">
                <span>BEST TIME!</span>
            </div>
        </div>
        <div class="ui__prefs">
            <range name="size" title="Cube Size" list="2,3,4,5"></range>
            <range name="flip" title="Flip Type" list="Fast,Normal,Smooth"></range>
            <range name="scramble" title="Scramble Length" list="Easy,Normal,Hard"></range>
            <range name="fov" title="Camera Angle" list="Aperture"></range>
            <range name="theme" title="Theme" list="Cube,Erno,Dust,Camo,Rain"></range>
        </div>
        <div class="ui__theme">
            <range name="hue" title="Hue" color></range>
            <range name="saturation" title="Saturation" color></range>
            <range name="lightness" title="Lightness" color></range>
        </div>
        <div class="ui__stats">
            <div class="stats" name="cube-size"><i>Cube size:</i><b>3x3x3</b></div>
            <div class="stats" name="total-solves"><i>Total solves:</i><b>-</b></div>
            <div class="stats" name="best-time"><i>Best time:</i><b>-</b></div>
            <div class="stats" name="worst-time"><i>Worst time:</i><b>-</b></div>
            <div class="stats" name="average-5"><i>Average of 5:</i><b>-</b></div>
            <div class="stats" name="average-12"><i>Average of 12:</i><b>-</b></div>
            <div class="stats" name="average-25"><i>Average of 25:</i><b>-</b></div>
        </div>
        <div class="ui__buttons">
            <button class="btn btn--back btn--bl"><icon back></icon></button>
            <button class="btn btn--stats btn--bl"><icon trophy></icon></button>
            <button class="btn btn--prefs btn--br"><icon settings></icon></button>
            <button class="btn btn--theme btn--br"><icon theme></icon></button>
            <button class="btn btn--reset btn--bc"><icon reset></icon></button>
        </div>
    </div>

    <!-- Include Three.js r101 to match the script's patterns -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/101/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
